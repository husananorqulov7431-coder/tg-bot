name: Telegram Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *" # 21:30 Asia/Tashkent (UTC+5)

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET: "@teleposttestuz"
        run: python bot.py
