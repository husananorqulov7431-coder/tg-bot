name: Telegram AI Content Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OmniRoute
        run: npm install -g omniroute

      - name: Validate OmniRoute secret
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: test -n "$OMNIROUTE_API_KEY" || { echo "::error::OMNIROUTE_API_KEY is missing"; exit 1; }

      - name: Start OmniRoute
        env:
          PORT: "20128"
          NODE_ENV: "production"
          NEXT_PUBLIC_BASE_URL: "http://127.0.0.1:20128"
          REQUIRE_API_KEY: "true"
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          nohup omniroute --no-open > omniroute.log 2>&1 &
          echo $! > omniroute.pid

      - name: Wait for OmniRoute
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, time, urllib.request
          url = "http://127.0.0.1:20128/v1/models"
          key = os.environ["OMNIROUTE_API_KEY"].strip()
          last = None
          for _ in range(45):
              try:
                  req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key})
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      print("OmniRoute models HTTP:", resp.status)
                      print(body[:2000])
                      if resp.status == 200:
                          sys.exit(0)
              except Exception as exc:
                  last = exc
              time.sleep(2)
          print("::error::OmniRoute did not become ready")
          print("Last error:", last)
          sys.exit(1)
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AI content agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: "http://127.0.0.1:20128/v1"
          OMNIROUTE_MODEL: "auto"
        run: python bot.py

      - name: Show OmniRoute log on failure
        if: failure()
        run: |
          test -f omniroute.log && tail -n 160 omniroute.log || true
