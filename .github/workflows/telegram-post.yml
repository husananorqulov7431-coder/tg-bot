name: Telegram Auto Post

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 16 * * *" # 21:30 Asia/Tashkent (UTC+5)

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify dependencies
        run: python -c "import bs4, requests; print('Dependencies OK')"

      - name: Run publisher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET: "@teleposttestuz"
        run: python bot.py
