name: Telegram AI Content Agent

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 16 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate GitHub secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_TARGET" || { echo "::error::TELEGRAM_TARGET is missing"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "::error::OPENROUTER_API_KEY is missing"; exit 1; }
          echo "Required secrets are present."
      - name: Run AI content agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGET: ${{ secrets.TELEGRAM_TARGET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openai/gpt-oss-20b:free
        run: python bot.py
